name: Docker publish

# Release-only image publishing to GHCR. The PR gate stays in ci.yml
# (docker smoke job); this workflow never runs on PRs or branch pushes.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Build and push multi-arch image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Single source of truth for tags: both variants share the same tag
      # list below; the acme step only adds the -acme suffix via flavor.
      - name: Docker metadata (default)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mimi1vx/stdio2http
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Docker metadata (acme)
        id: meta-acme
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mimi1vx/stdio2http
          # onlatest=true is load-bearing: without it the suffix is NOT
          # applied to the `latest` tag, and the acme build would push a
          # bare `latest` over the default image.
          flavor: |
            suffix=-acme,onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push default image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BIN_FEATURES=
          cache-from: type=gha,scope=default
          cache-to: type=gha,mode=max,scope=default

      - name: Build and push acme image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-acme.outputs.tags }}
          labels: ${{ steps.meta-acme.outputs.labels }}
          build-args: |
            BIN_FEATURES=acme
          cache-from: type=gha,scope=acme
          cache-to: type=gha,mode=max,scope=acme
